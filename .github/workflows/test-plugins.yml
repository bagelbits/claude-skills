name: test-plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: bash scripts/run-plugin-tests.sh
